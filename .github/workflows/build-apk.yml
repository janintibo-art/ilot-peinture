name: Build APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform project
        run: flutter create --platforms=android --project-name ilot_peinture --org fr.ilotpeinture .
      - name: Install dependencies
        run: flutter pub get
      - name: Allow server HTTP inside private network
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s=s.replace('<application','<application android:usesCleartextTraffic="true"')
          p.write_text(s)
          PY
      - name: Analyze
        run: flutter analyze lib
      - name: Test
        run: flutter test
      - name: Build
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ilot-peinture-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
