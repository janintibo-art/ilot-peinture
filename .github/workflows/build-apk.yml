name: Build APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ilot-peinture-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform project
        run: flutter create --platforms=android --project-name ilot_peinture --org fr.ilotpeinture .
      - name: Install branded Android launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp "assets/launcher_${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
      - name: Install dependencies
        run: flutter pub get
      - name: Allow server HTTP inside private network
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s=s.replace('<application','<application android:usesCleartextTraffic="true"')
          p.write_text(s)
          PYTHON
      - name: Analyze
        run: flutter analyze lib
      - name: Test
        run: flutter test
      - name: Build
        run: flutter build apk --release
      - name: Publish APK in a stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ilot-peinture.apk
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest ilot-peinture.apk --clobber
          else
            gh release create test-latest ilot-peinture.apk --title "Îlot Peinture - version d'essai" --notes "APK Android de test. Installation réservée aux personnes autorisées. Utiliser des données fictives." --latest
          fi
      - name: Prepare GitHub Pages website
        run: |
          mkdir -p public
          cp site/index.html public/index.html
          cp assets/logo.png public/logo.png
          cp assets/icon.png public/icon.png
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}/g" public/index.html
          touch public/.nojekyll
      - name: Publish site to gh-pages without Actions artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
